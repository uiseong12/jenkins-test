package com.example.inventory;

import java.util.*;
import java.util.logging.Logger;

public class InventoryService {
    private static final Logger logger = Logger.getLogger(InventoryService.class.getName());
    private final Map<String, Item> inventory = new HashMap<>();

    public void addItem(String itemId, String name, int quantity, double price) {
        if (itemId == null || itemId.isEmpty() || name == null || name.isEmpty()) {
            throw new IllegalArgumentException("Item ID and name cannot be null or empty");
        }
        if (quantity < 0 || price < 0) {
            throw new IllegalArgumentException("Quantity and price must be non-negative");
        }

        Item item = new Item(itemId, name, quantity, price);
        inventory.put(itemId, item);
        logger.info("Item added: " + item);
    }

    public Optional<Item> findItemById(String itemId) {
        return Optional.ofNullable(inventory.get(itemId));
    }

    public void updateQuantity(String itemId, int quantity) {
        Item item = inventory.get(itemId);
        if (item != null) {
            item.setQuantity(quantity);
            logger.info("Quantity updated for item: " + itemId + " to " + quantity);
        } else {
            logger.warning("Item not found: " + itemId);
        }
    }

    public void removeItem(String itemId) {
        Item removed = inventory.remove(itemId);
        if (removed != null) {
            logger.info("Item removed: " + itemId);
        } else {
            logger.warning("Item not found: " + itemId);
        }
    }

    public double calculateTotalInventoryValue() {
        return inventory.values().stream()
                .mapToDouble(item -> item.getPrice() * item.getQuantity())
                .sum();
    }

    public void listAllItems() {
        if (inventory.isEmpty()) {
            logger.info("No items in inventory.");
        } else {
            inventory.values().forEach(item -> logger.info(item.toString()));
        }
    }

    // Inner Item class
    private static class Item {
        private final String itemId;
        private final String name;
        private int quantity;
        private final double price;

        public Item(String itemId, String name, int quantity, double price) {
            this.itemId = itemId;
            this.name = name;
            this.quantity = quantity;
            this.price = price;
        }

        public String getItemId() { return itemId; }
        public String getName() { return name; }
        public int getQuantity() { return quantity; }
        public void setQuantity(int quantity) { this.quantity = quantity; }
        public double getPrice() { return price; }

        @Override
        public String toString() {
            return "Item{id='" + itemId + "', name='" + name + "', quantity=" + quantity + ", price=" + price + '}';
        }
    }
}
