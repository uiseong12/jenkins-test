public abstract class BankAccount {
    protected String accountHolder;
    protected double balance;

    public BankAccount(String accountHolder, double initialBalance) {
        this.accountHolder = accountHolder;
        this.balance = initialBalance;
    }

    public String getAccountHolder() {
        return accountHolder;
    }

    public double getBalance() {
        return balance;
    }

    public abstract void deposit(double amount);
    public abstract void withdraw(double amount);
}

interface Transaction {
    void execute();
}

class Deposit implements Transaction {
    private BankAccount account;
    private double amount;

    public Deposit(BankAccount account, double amount) {
        this.account = account;
        this.amount = amount;
    }

    @Override
    public void execute() {
        account.deposit(amount);
    }
}

class Withdrawal implements Transaction {
    private BankAccount account;
    private double amount;

    public Withdrawal(BankAccount account, double amount) {
        this.account = account;
        this.amount = amount;
    }

    @Override
    public void execute() {
        account.withdraw(amount);
    }
}

class CheckingAccount extends BankAccount {

    public CheckingAccount(String accountHolder, double initialBalance) {
        super(accountHolder, initialBalance);
    }

    @Override
    public void deposit(double amount) {
        if (amount <= 0) {
            System.out.println("Deposit amount must be positive.");
            return;
        }
        balance += amount;
        System.out.println(amount + " deposited. New balance: " + balance);
    }

    @Override
    public void withdraw(double amount) {
        if (amount > balance) {
            System.out.println("Insufficient funds.");
            return;
        }
        balance -= amount;
        System.out.println(amount + " withdrawn. New balance: " + balance);
    }
}

public class BankSystem {
    public static void main(String[] args) {
        BankAccount account = new CheckingAccount("John Doe", 1000);
        Transaction deposit = new Deposit(account, 200);
        Transaction withdrawal = new Withdrawal(account, 500);

        deposit.execute();
        withdrawal.execute();

        System.out.println("Final balance: " + account.getBalance());
    }
}
