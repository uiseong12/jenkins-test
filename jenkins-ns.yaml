package com.example.order;

import java.util.*;
import java.util.logging.Logger;

public class OrderService {
    private static final Logger logger = Logger.getLogger(OrderService.class.getName());
    private final List<Order> orderList = new ArrayList<>();

    public void addOrder(int orderId, String productName, int quantity) {
        if (productName == null || productName.isEmpty()) {
            throw new IllegalArgumentException("Product name cannot be null or empty");
        }
        if (quantity <= 0) {
            throw new IllegalArgumentException("Quantity must be greater than zero");
        }
        
        Order order = new Order(orderId, productName, quantity);
        orderList.add(order);
        logger.info("Order added: " + order);
    }

    public Optional<Order> findOrderById(int orderId) {
        return orderList.stream()
                .filter(order -> order.getOrderId() == orderId)
                .findFirst();
    }

    public void cancelOrder(int orderId) {
        Optional<Order> order = findOrderById(orderId);
        if (order.isPresent()) {
            orderList.remove(order.get());
            logger.info("Order cancelled: " + orderId);
        } else {
            logger.warning("Order not found: " + orderId);
        }
    }

    public void listAllOrders() {
        if (orderList.isEmpty()) {
            logger.info("No orders to display.");
        } else {
            orderList.forEach(order -> logger.info(order.toString()));
        }
    }

    // Inner Order class
    private static class Order {
        private final int orderId;
        private final String productName;
        private final int quantity;

        public Order(int orderId, String productName, int quantity) {
            this.orderId = orderId;
            this.productName = productName;
            this.quantity = quantity;
        }

        public int getOrderId() { return orderId; }
        public String getProductName() { return productName; }
        public int getQuantity() { return quantity; }

        @Override
        public String toString() {
            return "Order{id=" + orderId + ", product='" + productName + "', quantity=" + quantity + '}';
        }
    }
}
